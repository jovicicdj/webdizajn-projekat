<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registracija / Prijava</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="wrapper">
        <div class="login-main">
            <div class="login-main-left">
                <!-- adresa, datum rodjenja, email, ime, prezime, korisnicko ime, lozinka, zanimanje -->
                <div class="login-container">
                    <h3>Registracija</h3>
                    <form action="" method="post" id="login-forma">
                        <label for="ime"> Ime</label>
                        <input type="text" id="ime" placeholder="Đorđe">

                        <label for="prezime"> Prezime</label>
                        <input type="text" id="prezime" placeholder="Jovičić">

                        <label for="korisnicko-ime"> Korisnicko ime</label>
                        <input type="text" id="korisnicko-ime" placeholder="djole1232">

                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="jovicic.sv7.2025@uns.ac.rs">

                        <label for="datum-rodjenja"> Datum rodjenja</label>
                        <input type="date" id="datum-rodjenja">

                        <label for="zanimanje">Zanimanje</label>
                        <input type="text" id="zanimanje" placeholder="student">

                        <label for="adresa">Adresa</label>
                        <input type="text" id="ime" placeholder="Dr Sime Miloševića 8">

                        <label for="lozinka">Lozinka</label>
                        <input type="text" id="lozinka" placeholder="Unesite lozinku...">
                        
                        <div class="login-form-buttons">
                            <input type="reset" value="Otkazi" class="login-reset">
                            <input type="submit" value="Prijavi se" class="login-submit">
                        </div>

                    </form>
                </div>

                <div class="signup">
                    <!-- korisnicko ime, sifra -->
                </div>
            </div>

            <div class="login-main-right">
                <div class="login-tekst">
                    <h1>Najveca stranica za ljubitelje knjiga</h1>
                    <p>Registruj se danas.</p>
                </div>

                <div class="login-slika"></div>

                <footer>
                    <div class="footer-card">
                        <p class="footer-stat">1240</p>
                        <p class="footer-value">књига</p>
                    </div>

                    <div class="footer-card">
                        <p class="footer-stat">380</p>
                        <p class="footer-value">аутора</p>
                    </div>

                    <div class="footer-card">
                        <p class="footer-stat">8500</p>
                        <p class="footer-value">рецензија</p>
                    </div>

                    <div class="footer-card">
                        <p class="footer-stat">2100</p>
                        <p class="footer-value">Читалаца</p>
                    </div>

                </footer>
            </div>
        </div>
    </div>
</body>
<script src="JS/ajax.js"></script>
<script src="JS/footer.js"></script>
</html>
