<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registracija / Prijava</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="wrapper">
        <div class="login-main">
            <div class="login-main-left">
                <!-- adresa, datum rodjenja, email, ime, prezime, korisnicko ime, lozinka, zanimanje -->
                <div class="login-container">
                    <div class="login-container-header">
                        <div class="registracija-prijava">
                            <h3 class="active-hyperlink" id="register-text" onclick="prikaziFormuRegistracija()">Регистрација</h3>
                            <p>|</p>
                            <h3 onclick="prikaziFormuPrijava()" id="sign-up-text">Пријава</h3>
                        </div>
                        <a href="#" class="login-hiperlink">&larr;Назад</a>
                    </div>
                    <form action="" method="post" id="sign-up-forma" class="suf" novalidate>
                        <label for="ime">Име</label>
                        <input type="text" id="ime" placeholder="Đorđe" required>

                        <label for="prezime">Презиме</label>
                        <input type="text" id="prezime" placeholder="Jovičić" required>

                        <label for="korisnicko-ime">Корисничко име</label>
                        <input type="text" id="korisnicko-ime" placeholder="djole_j" required>

                        <label for="email">Е-маил</label>
                        <input type="email" id="email" placeholder="jovicic.sv7.2025@uns.ac.rs" required>

                        <label for="datum-rodjenja">Датум рођења</label>
                        <input type="date" id="datum-rodjenja" required>

                        <label for="zanimanje">Занимање</label>
                        <input type="text" id="zanimanje" placeholder="student" required>

                        <label for="adresa">Адреса</label>
                        <input type="text" id="adresa" placeholder="Dr Sime Miloševića 8, Novi Sad" required>

                        <label for="lozinka">Лозинка</label>
                        <input type="password" id="lozinka" placeholder="Unesite lozinku..." required>
                        
                        <div class="sign-up-form-buttons">
                            <input type="reset" value="Otkazi" class="sign-up-reset">
                            <input type="submit" value="Prijavi se" class="sign-up-submit">
                        </div>
                    </form>

                    <form action="" method="post" id="login-forma" class="lf" novalidate>
                        
                        <label for="korisnicko-ime-sign-up">Корисничко име</label>
                        <input type="text" id="korisnicko-ime-sign-up" placeholder="djole_j" required maxlength="30">

                        <label for="lozinka-sign-up">Лозинка</label>
                        <input type="password" id="lozinka-sign-up" placeholder="Unesite lozinku..." required minlength="8">
                        
                        <p id="login-greska" style="display:none; color:#e06060; font-size:0.8em;"></p>

                        <div class="sign-up-form-buttons">
                            <input type="reset" value="Otkazi" class="sign-up-reset">
                            <input type="submit" value="Prijavi se" class="sign-up-submit">
                        </div>
                    </form>
                </div>

                <div class="signup">
                    <!-- korisnicko ime, sifra -->
                </div>
            </div>

            <div class="login-main-right">
                <div class="login-tekst">
                    <h1>Највећа страница за љубитеље књига</h1>
                    <p>Региструј се данас.</p>
                </div>

                <div class="login-slika"></div>

                <footer>
                    <div class="footer-card">
                        <p class="footer-stat">1240</p>
                        <p class="footer-value">књига</p>
                    </div>

                    <div class="footer-card">
                        <p class="footer-stat">380</p>
                        <p class="footer-value">аутора</p>
                    </div>

                    <div class="footer-card">
                        <p class="footer-stat">8500</p>
                        <p class="footer-value">рецензија</p>
                    </div>

                    <div class="footer-card">
                        <p class="footer-stat">2100</p>
                        <p class="footer-value">Читалаца</p>
                    </div>

                </footer>
            </div>
        </div>
    </div>
</body>
<script src="JS/ajax.js"></script>
<script src="JS/footer.js"></script>
<script src="JS/regExLogin.js"></script>
<script src="JS/login.js"></script>

</html>
